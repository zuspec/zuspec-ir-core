[project]
name = "zuspec-ir-core"
dynamic = ["version"]
description = "Zuspec core intermediate representation"
requires-python = ">=3.10"
# PyYAML is imported at module scope by zuspec/ir/core/serializer.py, which
# __init__.py imports unconditionally -- so `import zuspec.ir.core` fails
# outright without it. It went unnoticed because every environment that
# exercised this package also installed something that happened to pull PyYAML
# in transitively; a minimal wheel-only install of pssc does not.
dependencies = [
    "PyYAML",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

